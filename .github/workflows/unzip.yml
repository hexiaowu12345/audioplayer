on: workflow_dispatch
permissions:
  contents: write
jobs:
  u:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          f=$(ls audioplayer_*.zip | head -1)
          mkdir -p /tmp/o
          unzip -q "$f" -d /tmp/o
          cp -r /tmp/o/audioplayer/. .
          rm -f "$f"
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          git add -A
          git commit -m unzip
          git push
